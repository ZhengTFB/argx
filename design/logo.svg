<!--
  ARGX 标识。三个仓库的 README 顶部共用这一份（硬件仓与 skill 仓的 assets/logo.svg
  与它是同一个文件）。
  画法：design/favicon.svg 里那个 A 标记加「ARGX」字标，横向排布。
  填充色取 tokens.css 的品牌强调色 accent-500（#3B7BF0），在 SVG 里写成字面 hex：
  不引外部样式，这样 GitHub 的浅色主题与深色主题下都看得见，一份文件即可。
  注意：XML 注释里不能出现连续两个减号，所以上面不写 CSS 变量名。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80" role="img" aria-label="ARGX">
  <g transform="translate(4 8)">
    <g transform="rotate(45 32 32)">
      <rect x="17" y="17" width="30" height="30" rx="8"
            fill="none" stroke="#3B7BF0" stroke-width="3"/>
    </g>
    <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
          font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="25" font-weight="800" fill="#3B7BF0">A</text>
  </g>
  <text x="88" y="42" dominant-baseline="central"
        font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="52" font-weight="800" letter-spacing="-1.6" fill="#3B7BF0">ARGX</text>
</svg>
